# Lookout configuration. No secrets here: those come from the environment (.env).

# How far back each run looks. Matches the hourly timer.
window_minutes = 60

[prometheus]
url = "http://localhost:9090"
timeout_seconds = 10
# Filesystems that are not real disks
exclude_fstypes = ["tmpfs", "overlay", "squashfs", "efivarfs", "devtmpfs"]

[host]
# Mountpoints checked directly (fallback when Prometheus is down)
mounts = ["/", "/boot/efi"]

[journal]
timeout_seconds = 60

[wifi]
# Kernel message logged on every WiFi (re)authentication by the RTL8812BU driver
reauth_pattern = "send eapol packet 4/4"
window_hours = 24

# Journal entries matching these regexes are counted as known noise instead of
# errors: they never trigger spike or novel-error flags. Keep this list short and
# explain each entry.
[[journal.known_noise]]
pattern = "Timeout occurred while waiting for network connectivity"
reason = "apt-daily runs before WiFi is fully up; harmless and recurring"

[[journal.known_noise]]
# Only Docker's virtual interfaces (veth<hex>): a real interface (eth0, wlan0...) going
# missing is still an error. Seen from networkd-dispatcher and networkctl on every crash.
pattern = '^Interface "veth[0-9a-f]+" not found\.?$'
reason = "Docker removes a container's virtual interface when the container stops; networkd-dispatcher then can't find it"

[state]
# Overridden by $STATE_DIRECTORY (set by systemd) or --state
default_path = "~/.local/state/lookout/state.sqlite"
sample_retention_days = 30
template_retention_days = 90

# Thresholds were chosen from 14 days of history (2026-10-29):
# load15 median 1.95 / max 4.37, memory available never below 74%, swap never used,
# journal errors at most 1 per hour per unit.
[thresholds]
disk_warn_pct = 85
disk_crit_pct = 95
disk_full_within_days = 7      # predict_linear says the disk fills within this many days -> warn
mem_avail_warn_pct = 10
mem_avail_crit_pct = 5
swap_warn_bytes = 1073741824   # 1 GiB
load15_warn = 6
load15_crit = 8
wifi_reauths_warn = 4          # per wifi.window_hours; normal is 0-2 per day
wifi_reauths_crit = 10

[baseline]
history_hours = 168            # 7 days of hourly error counts per source
spike_floor = 5                # never flag fewer errors than this in one window
spike_mad_k = 4                # threshold = max(floor, median + k * MAD)
warmup_floor = 20              # fixed threshold while history is shorter than history_hours
spike_crit_multiplier = 5      # crit when count >= threshold * this
novel_max_flags = 5            # more novel templates than this are grouped into one flag

[cooldown]
reminder_hours = 24            # re-report a still-active issue at most this often
event_cooldown_hours = 6       # spikes/novel errors: suppress repeats for this long
flap_window_hours = 6          # at most one "resolved" notice per issue per this many hours

[docker]
# Read-only proxy from deploy/docker-socket-proxy (only list, logs and ping get through)
proxy_url = "http://127.0.0.1:2375"
timeout_seconds = 30
max_log_bytes = 20000000       # per container per request
ignore = []                    # container names never flagged (e.g. ones you stop on purpose)
known_noise = []               # same format as [[journal.known_noise]]
# Container logs have no syslog priority, so a line counts as an error if it
# matches one of these. Calibrated on 14 days of this server's container logs.
error_patterns = [
  '(?i)\blevel=(error|fatal|crit|critical|panic)\b',
  '(?i)"level":\s*"(error|fatal|crit|critical|panic)"',
  '\b(ERROR|FATAL|PANIC|CRITICAL)\b',
  '\[(error|fatal|crit)\]',
  'Traceback \(most recent call last\)',
  '\bpanic:',
  '(?i)\bunhandled (exception|rejection)\b',
]

[llm]
# Local Ollama. Small models only (no 9B/14B): Lookout shares a 16 GB, 4-core box
# with real services. Picked by the phase 6 benchmark (2026-10-29, Ollama 0.32.5):
# llama3.2:3b in schema mode, median 58 s per cold summary, 2.5 GB RAM, passed all
# checks. phi4-mini also passed but was slower; qwen3.5:4b repeated injected text.
# See bench/results/2026-10-29-1307.md.
url = "http://localhost:11434"
model = "llama3.2:3b"
output_mode = "schema"         # schema | json | plain (see bench/benchmark.py)
think = false                  # always sent as "think": false
timeout_seconds = 600          # a slow summary is fine; a missing one falls back to facts only
num_ctx = 4096
num_predict = 600
# How long Ollama keeps the model in RAM after a call (Ollama's default here: 60s, so each
# explanation starts with a cold load). For a live demo: keep_alive = "30m". Unset = Ollama's default.
# keep_alive = "30m"

[notify]
# Discord delivery. false = dashboard only: incidents and history are still recorded, issues
# still count as reported (cooldowns work), and the Uptime Kuma heartbeat is still sent.
# No DISCORD_* secrets are needed. Set to true to send reports to Discord again.
discord = false

[dashboard]
# python -m lookout.dashboard: read-only web UI. Keep it on localhost; Caddy fronts it on the LAN.
bind = "127.0.0.1"
port = 8088
# Extra words scrubbed from every API response, on top of this machine's own host name,
# IPs and *.internal/.local/.lan/ts.net names (e.g. Tailscale machine names).
hide_names = []
# Containers left out of the dashboard's status grid (e.g. ones you'd rather not advertise on
# a public screen). Detection is unaffected: their incidents are still recorded and reported.
# Put machine-specific names in config.local.toml (gitignored), not here.
hide_containers = []
