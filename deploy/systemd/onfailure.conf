# Drop-in: when this unit fails, start a Lookout investigation of it right away.
# Installed as /etc/systemd/system/<unit>.d/lookout-onfailure.conf by deploy/install-onfailure.sh.
# It only ADDS an OnFailure= target; it changes nothing else about the unit, and needs
# no restart of the unit (systemctl daemon-reload is enough).
# Note: with Restart=always/on-failure, systemd restarts the unit first; OnFailure= fires
# only when it gives up (the unit's start limit). Single crashes are caught by the timer.
[Unit]
OnFailure=lookout-investigate@%n.service
