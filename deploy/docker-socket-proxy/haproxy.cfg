# Read-only Docker API proxy for Lookout.
#
# Only three read-only endpoints get through; everything else gets 403:
#   GET /containers/json          list containers (state, status, health; no env vars)
#   GET /containers/<id>/logs     container logs
#   GET /_ping                    health check
# Notably blocked: any POST/PUT/DELETE (start, stop, exec, run...), inspect
# (/containers/<id>/json exposes env vars), /archive and /export (copy files
# out of containers), images, volumes, networks, events, system info.

global
    log stdout format raw local0 notice

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 120s

frontend docker_readonly
    bind :2375
    acl read_method  method GET HEAD
    acl list         path_reg ^(/v[0-9.]+)?/containers/json$
    acl logs         path_reg ^(/v[0-9.]+)?/containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/logs$
    acl ping         path_reg ^(/v[0-9.]+)?/_ping$
    # Following logs would hold the connection open forever
    acl follow       url_param(follow) -m reg ^(1|true)$
    http-request deny deny_status 403 unless read_method
    http-request deny deny_status 403 if follow
    http-request deny deny_status 403 unless list or logs or ping
    default_backend docker

backend docker
    server dockerd /var/run/docker.sock
